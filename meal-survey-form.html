<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>استفتاء الوجبات - لينه فارمز</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:linear-gradient(135deg,#fff8e1,#fff3e0);min-height:100vh;padding:12px}
.card{background:white;border-radius:16px;padding:20px 16px;max-width:500px;width:100%;margin:0 auto;box-shadow:0 4px 20px rgba(0,0,0,0.08)}
.header{background:linear-gradient(135deg,#f57c00,#ffb74d);border-radius:14px;padding:20px;margin:-20px -16px 20px;text-align:center;color:white}
.header .logo{font-size:42px;margin-bottom:4px}
.header h1{font-size:18px;font-weight:800;margin-bottom:2px}
.header .sub{font-size:12px;opacity:0.85}
.step{margin-bottom:18px}
.step-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #f0f0f0}
.step-num{background:linear-gradient(135deg,#f57c00,#ffb74d);color:white;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0}
.step-title{font-size:15px;font-weight:700;color:#333}
.form-group{margin-bottom:12px}
label{display:block;font-weight:700;color:#555;margin-bottom:5px;font-size:13px}
input,select,textarea{width:100%;padding:11px 12px;border:2px solid #e0e0e0;border-radius:10px;font-size:14px;font-family:'Cairo',sans-serif;transition:border 0.2s;background:white;-webkit-appearance:none}
input:focus,select:focus,textarea:focus{border-color:#f57c00;outline:none}
.meal-card{background:#fff8e1;border:2px solid #ffe0b2;border-radius:12px;padding:16px;margin-bottom:12px;text-align:center}
.meal-card h3{font-size:16px;color:#e65100;margin-bottom:12px}
.smileys{display:flex;justify-content:center;gap:12px;margin-bottom:8px}
.smiley{width:56px;height:56px;border-radius:50%;border:3px solid #e0e0e0;background:white;font-size:32px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center}
.smiley:active{transform:scale(0.9)}
.smiley.selected{border-color:#f57c00;background:#fff3e0;transform:scale(1.15)}
.smiley-label{font-size:11px;color:#888;margin-top:2px}
.comment-area{margin-top:10px;background:#fff3e0;border-radius:10px;padding:12px}
.comment-area label{color:#e65100;font-size:12px;margin-bottom:6px}
.comment-area input{border-color:#ffcc80;font-size:13px}
.btn-submit{width:100%;padding:16px;background:linear-gradient(135deg,#2e7d32,#4caf50);color:white;border:none;border-radius:12px;font-size:18px;font-weight:800;cursor:pointer;font-family:'Cairo',sans-serif;margin-top:6px;transition:transform 0.2s}
.btn-submit:active{transform:scale(0.98)}
.btn-submit:disabled{background:#ccc;cursor:not-allowed}
.success{display:none;text-align:center;padding:40px 16px}
.success .icon{font-size:60px;margin-bottom:12px}
.success h2{color:#2e7d32;font-size:20px;margin-bottom:8px}
.success p{color:#666;font-size:14px;line-height:1.8}
.btn-reset{width:100%;padding:14px;background:linear-gradient(135deg,#1565c0,#1976d2);color:white;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;margin-top:16px}
.error-msg{background:#ffebee;color:#c62828;padding:12px;border-radius:10px;margin-top:10px;font-size:13px;display:none;text-align:center}
.footer{margin-top:20px;font-size:10px;color:#bbb;text-align:center}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="logo">📝</div>
    <h1>استفتاء الوجبات</h1>
    <div class="sub">الواحات البحريه — قيم وجبتك</div>
  </div>

  <div id="survey-form">
    <div class="step">
      <div class="step-header">
        <div class="step-num">1</div>
        <div class="step-title">اسمك</div>
      </div>
      <div class="form-group">
        <input type="text" id="sv-employee" placeholder="اسم الموظف">
      </div>
    </div>

    <div class="step">
      <div class="step-header">
        <div class="step-num">2</div>
        <div class="step-title">اختار الوجبة وقيّمها</div>
      </div>

      <div class="meal-card" id="meal-fatar">
        <h3>🍳 إفطار</h3>
        <div class="smileys">
          <div><div class="smiley" onclick="rate('فطار',1,this)">😡</div><div class="smiley-label">سيء جداً</div></div>
          <div><div class="smiley" onclick="rate('فطار',2,this)">😟</div><div class="smiley-label">مقبول</div></div>
          <div><div class="smiley" onclick="rate('فطار',3,this)">😐</div><div class="smiley-label">جيد</div></div>
          <div><div class="smiley" onclick="rate('فطار',4,this)">😄</div><div class="smiley-label">ممتاز</div></div>
        </div>
        <div class="comment-area" id="comment-fatar">
          <label>💬 ملاحظتك (اختياري)</label>
          <input type="text" id="comment-input-fatar" placeholder="اكتب ملاحظتك...">
        </div>
      </div>

      <div class="meal-card" id="meal-ghadaa">
        <h3>🧀 غداء</h3>
        <div class="smileys">
          <div><div class="smiley" onclick="rate('غداء',1,this)">😡</div><div class="smiley-label">سيء جداً</div></div>
          <div><div class="smiley" onclick="rate('غداء',2,this)">😟</div><div class="smiley-label">مقبول</div></div>
          <div><div class="smiley" onclick="rate('غداء',3,this)">😐</div><div class="smiley-label">جيد</div></div>
          <div><div class="smiley" onclick="rate('غداء',4,this)">😄</div><div class="smiley-label">ممتاز</div></div>
        </div>
        <div class="comment-area" id="comment-ghadaa">
          <label>💬 ملاحظتك (اختياري)</label>
          <input type="text" id="comment-input-ghadaa" placeholder="اكتب ملاحظتك...">
        </div>
      </div>

      <div class="meal-card" id="meal-ashaa">
        <h3>🍗 عشاء</h3>
        <div class="smileys">
          <div><div class="smiley" onclick="rate('عشاء',1,this)">😡</div><div class="smiley-label">سيء جداً</div></div>
          <div><div class="smiley" onclick="rate('عشاء',2,this)">😟</div><div class="smiley-label">مقبول</div></div>
          <div><div class="smiley" onclick="rate('عشاء',3,this)">😐</div><div class="smiley-label">جيد</div></div>
          <div><div class="smiley" onclick="rate('عشاء',4,this)">😄</div><div class="smiley-label">ممتاز</div></div>
        </div>
        <div class="comment-area" id="comment-ashaa">
          <label>💬 ملاحظتك (اختياري)</label>
          <input type="text" id="comment-input-ashaa" placeholder="اكتب ملاحظتك...">
        </div>
      </div>
    </div>

    <button class="btn-submit" id="submit-btn" onclick="submitAll()">✅ إرسال التقييم</button>
    <div class="error-msg" id="error-msg"></div>
  </div>

  <div class="success" id="success-msg">
    <div class="icon">🎉</div>
    <h2>شكراً لتقييمك!</h2>
    <p>تم حفظ تقييمك بنجاح.</p>
    <button class="btn-reset" onclick="resetForm()">📝 تقييم جديد</button>
  </div>
  <div class="footer">LINAH FARMS — Baharia Oasis — Meal Survey</div>
</div>

<script>
var SB = 'https://cwqghiqykohefaggedjl.supabase.co';
var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN3cWdoaXF5a29oZWZhZ2dlZGpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMjUyMjEsImV4cCI6MjA5NjYwMTIyMX0.3a3hRcNdmYQCtjYjBroAT6df1T_7oz-XWUeD3wagYw8';
var HEADERS = { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' };

var ratings = {};

function rate(meal, rating, el) {
  var employee = document.getElementById('sv-employee').value.trim();
  if (!employee) {
    document.getElementById('error-msg').textContent = '⚠️ ادخل اسمك الأول';
    document.getElementById('error-msg').style.display = 'block';
    return;
  }
  document.getElementById('error-msg').style.display = 'none';

  ratings[meal] = rating;

  var parent = el.closest('.smileys');
  parent.querySelectorAll('.smiley').forEach(function(s) { s.classList.remove('selected'); });
  el.classList.add('selected');
}

function submitAll() {
  var employee = document.getElementById('sv-employee').value.trim();
  if (!employee) {
    document.getElementById('error-msg').textContent = '⚠️ ادخل اسمك';
    document.getElementById('error-msg').style.display = 'block';
    return;
  }

  var meals = ['فطار', 'غداء', 'عشاء'];
  var hasRating = false;
  meals.forEach(function(m) { if (ratings[m]) hasRating = true; });
  if (!hasRating) {
    document.getElementById('error-msg').textContent = '⚠️ قيّم وجبة واحدة على الأقل';
    document.getElementById('error-msg').style.display = 'block';
    return;
  }

  var btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'جاري الإرسال...';
  document.getElementById('error-msg').style.display = 'none';

  var today = new Date().toISOString().split('T')[0];
  var entries = [];
  meals.forEach(function(meal) {
    if (!ratings[meal]) return;
    var commentId = 'comment-input-' + (meal === 'فطار' ? 'fatar' : meal === 'غداء' ? 'ghadaa' : 'ashaa');
    var comment = document.getElementById(commentId).value.trim() || '';
    entries.push({
      date: today,
      meal: meal,
      rating: ratings[meal],
      employee: employee,
      comment: comment,
      timestamp: new Date().toISOString(),
      source: 'survey_form'
    });
  });

  fetch(SB + '/rest/v1/sync_data?id=eq.meal_survey_entries', {
    method: 'GET',
    headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY }
  })
  .then(function(r) { return r.json(); })
  .then(function(rows) {
    var existing = [];
    if (rows && rows.length > 0 && rows[0].data) {
      try { existing = rows[0].data; if (typeof existing === 'string') existing = JSON.parse(existing); } catch(e) { existing = []; }
    }
    entries.forEach(function(e) { existing.push(e); });
    if (rows && rows.length > 0) {
      return fetch(SB + '/rest/v1/sync_data?id=eq.meal_survey_entries', {
        method: 'PATCH',
        headers: HEADERS,
        body: JSON.stringify({ data: existing, updated_at: new Date().toISOString() })
      });
    } else {
      return fetch(SB + '/rest/v1/sync_data', {
        method: 'POST',
        headers: HEADERS,
        body: JSON.stringify({ id: 'meal_survey_entries', data: existing, updated_at: new Date().toISOString() })
      });
    }
  })
  .then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    document.getElementById('survey-form').style.display = 'none';
    document.getElementById('success-msg').style.display = 'block';
  })
  .catch(function(e) {
    var pending = JSON.parse(localStorage.getItem('linah_survey_pending') || '[]');
    entries.forEach(function(e) { pending.push(e); });
    localStorage.setItem('linah_survey_pending', JSON.stringify(pending));
    document.getElementById('survey-form').style.display = 'none';
    document.getElementById('success-msg').querySelector('h2').textContent = '⚠️ تم الحفظ محلياً';
    document.getElementById('success-msg').querySelector('p').textContent = 'لم يتم الاتصال، سيتم الرفع تلقائياً.';
    document.getElementById('success-msg').style.display = 'block';
  });
}

function resetForm() {
  ratings = {};
  document.getElementById('sv-employee').value = '';
  document.querySelectorAll('.smiley').forEach(function(s) { s.classList.remove('selected'); });
  document.querySelectorAll('.comment-area input').forEach(function(i) { i.value = ''; });
  document.getElementById('survey-form').style.display = 'block';
  document.getElementById('success-msg').style.display = 'none';
  document.getElementById('submit-btn').disabled = false;
  document.getElementById('submit-btn').textContent = '✅ إرسال التقييم';
  document.getElementById('error-msg').style.display = 'none';
}
</script>
</body>
</html>
