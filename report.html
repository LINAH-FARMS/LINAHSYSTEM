<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>بلاغ أعطال - لينه فارمز</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:linear-gradient(135deg,#1b5e20,#4caf50);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:white;border-radius:20px;padding:28px 24px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.3);text-align:center}
.logo{font-size:48px;margin-bottom:8px}
h1{color:#1b5e20;font-size:22px;margin-bottom:4px}
.sub{color:#888;font-size:12px;margin-bottom:20px}
.form-group{margin-bottom:14px;text-align:right}
label{display:block;font-weight:700;color:#333;margin-bottom:5px;font-size:13px}
input,select,textarea{width:100%;padding:11px;border:2px solid #e0e0e0;border-radius:10px;font-size:14px;font-family:'Cairo',sans-serif;transition:border 0.3s;-webkit-appearance:none}
input:focus,select:focus,textarea:focus{border-color:#1b5e20;outline:none}
textarea{resize:vertical;min-height:70px}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#1b5e20,#2e7d32);color:white;border:none;border-radius:10px;font-size:17px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;margin-top:8px;transition:transform 0.2s}
.btn:active{transform:scale(0.98)}
.btn:disabled{background:#ccc;cursor:not-allowed}
.success{display:none;text-align:center;padding:30px 16px}
.success .icon{font-size:56px;margin-bottom:12px}
.success h2{color:#1b5e20;font-size:18px;margin-bottom:8px}
.success p{color:#666;font-size:13px;line-height:1.6}
.required{color:red}
.footer{margin-top:16px;font-size:10px;color:#aaa}
.error-msg{background:#ffebee;color:#c62828;padding:12px;border-radius:8px;margin-top:10px;font-size:13px;display:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">🚨</div>
  <h1>بلاغ أعطال</h1>
  <div class="sub">الواحات البحريه</div>
  
  <div id="report-form">
    <div class="form-group">
      <label>القسم <span class="required">*</span></label>
      <select id="dept" required>
        <option value="">-- اختر القسم --</option>
        <option value="كهرباء">كهرباء</option>
        <option value="سباكة">سباكة</option>
        <option value="أجهزة">أجهزة</option>
        <option value="بناء">بناء</option>
        <option value="نظافة">نظافة</option>
        <option value="عمليات">عمليات</option>
        <option value="إداري">إداري</option>
        <option value="أخرى">أخرى</option>
      </select>
    </div>
    <div class="form-group">
      <label>رقم الموبايل <span class="required">*</span></label>
      <input type="tel" id="phone" placeholder="01xxxxxxxxx" required maxlength="11" inputmode="numeric">
    </div>
    <div class="form-group">
      <label>اسم العامل <span class="required">*</span></label>
      <input type="text" id="name" placeholder="الاسم الكامل" required>
    </div>
    <div class="form-group">
      <label>نوع العطل <span class="required">*</span></label>
      <select id="type" required>
        <option value="">-- اختر --</option>
        <option value="كهرباء">كهرباء</option>
        <option value="سباكة">سباكة</option>
        <option value="أجهزة">أجهزة</option>
        <option value="بناء">بناء</option>
        <option value="نظافة">نظافة</option>
        <option value="أخرى">أخرى</option>
      </select>
    </div>
    <div class="form-group">
      <label>وصف العطل <span class="required">*</span></label>
      <textarea id="desc" rows="3" placeholder="اوصف العطل..." required></textarea>
    </div>
    <div class="form-group">
      <label>الموقع</label>
      <input type="text" id="location" placeholder="المبنى / الغرفة">
    </div>
    <div class="form-group">
      <label>الأولوية</label>
      <select id="priority">
        <option value="متوسط">متوسط</option>
        <option value="عاجل">عاجل</option>
        <option value="منخفض">منخفض</option>
      </select>
    </div>
    <button class="btn" id="submit-btn" onclick="submitReport()">ارسال البلاغ</button>
    <div class="error-msg" id="error-msg"></div>
  </div>

  <div class="success" id="success-msg">
    <div class="icon">✅</div>
    <h2>تم الارسال بنجاح</h2>
    <p>شكراً لك — سيتم مراجعة البلاغ</p>
    <button class="btn" onclick="resetForm()" style="margin-top:16px;background:linear-gradient(135deg,#1565c0,#1976d2);">بلاغ جديد</button>
  </div>
  <div class="footer">LINAH FARMS - Baharia Oasis</div>
</div>

<script>
var SB = 'https://cwqghiqykohefaggedjl.supabase.co';
var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN3cWdoaXF5a29oZWZhZ2dlZGpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMjUyMjEsImV4cCI6MjA5NjYwMTIyMX0.3a3hRcNdmYQCtjYjBroAT6df1T_7oz-XWUeD3wagYw8';
var HEADERS = { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' };

// قراءة المعاملات من الرابط
(function() {
  var params = new URLSearchParams(window.location.search);
  var dept = params.get('dept') || params.get('section') || params.get('القسم');
  if (dept) {
    var sel = document.getElementById('dept');
    for (var i = 0; i < sel.options.length; i++) {
      if (sel.options[i].value === dept) { sel.selectedIndex = i; break; }
    }
    sel.style.background = '#e8f5e9';
    sel.style.borderColor = '#1b5e20';
  }
  var loc = params.get('location') || params.get('الموقع');
  if (loc) document.getElementById('location').value = loc;
})();

function showError(msg) {
  var el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = 'block';
}

function submitReport() {
  var dept = document.getElementById('dept').value;
  var phone = document.getElementById('phone').value.trim();
  var name = document.getElementById('name').value.trim();
  var type = document.getElementById('type').value;
  var desc = document.getElementById('desc').value.trim();
  var location = document.getElementById('location').value.trim();
  var priority = document.getElementById('priority').value;

  if (!dept || !phone || !name || !type || !desc) {
    alert('من فضلك ملأ جميع الحقول المطلوبة');
    return;
  }

  var btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'جاري الارسال...';
  document.getElementById('error-msg').style.display = 'none';

  var now = new Date();
  var dateStr = now.getFullYear() + '-' + ('0'+(now.getMonth()+1)).slice(-2) + '-' + ('0'+now.getDate()).slice(-2) + ' ' + ('0'+now.getHours()).slice(-2) + ':' + ('0'+now.getMinutes()).slice(-2);

  var report = {
    id: Date.now(),
    dept: dept,
    phone: phone,
    name: name,
    type: type,
    desc: desc,
    location: location || 'غير محدد',
    priority: priority,
    status: 'جديد',
    opened_at: dateStr,
    closed_at: ''
  };

  fetch(SB + '/rest/v1/sync_data?id=eq.incident_reports', {
    method: 'GET',
    headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY }
  })
  .then(function(r) { return r.json(); })
  .then(function(rows) {
    var reports = [];
    if (rows && rows.length > 0 && rows[0].data) {
      try { reports = rows[0].data; if (typeof reports === 'string') reports = JSON.parse(reports); } catch(e) { reports = []; }
    }
    reports.push(report);

    if (rows && rows.length > 0) {
      return fetch(SB + '/rest/v1/sync_data?id=eq.incident_reports', {
        method: 'PATCH',
        headers: HEADERS,
        body: JSON.stringify({ data: reports, updated_at: new Date().toISOString() })
      });
    } else {
      return fetch(SB + '/rest/v1/sync_data', {
        method: 'POST',
        headers: HEADERS,
        body: JSON.stringify({ id: 'incident_reports', data: reports, updated_at: new Date().toISOString() })
      });
    }
  })
  .then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    document.getElementById('report-form').style.display = 'none';
    document.getElementById('success-msg').style.display = 'block';
  })
  .catch(function(e) {
    var existing = JSON.parse(localStorage.getItem('linah_reports') || '[]');
    existing.push(report);
    localStorage.setItem('linah_reports', JSON.stringify(existing));
    document.getElementById('report-form').style.display = 'none';
    document.getElementById('success-msg').style.display = 'block';
  });
}

function resetForm() {
  document.getElementById('dept').selectedIndex = 0;
  document.getElementById('phone').value = '';
  document.getElementById('name').value = '';
  document.getElementById('type').value = '';
  document.getElementById('desc').value = '';
  document.getElementById('location').value = '';
  document.getElementById('priority').value = 'متوسط';
  document.getElementById('report-form').style.display = 'block';
  document.getElementById('success-msg').style.display = 'none';
  document.getElementById('submit-btn').disabled = false;
  document.getElementById('submit-btn').textContent = 'ارسال البلاغ';
  document.getElementById('error-msg').style.display = 'none';
}
</script>
</body>
</html>
